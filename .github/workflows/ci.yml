name: Selenium Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used by the optional "publish reports" step

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traceability check (documents, master CSV, test code)
        run: node tools/docs.js check
      - name: Run the tests (headless Chrome, no retries)
        run: mvn -B test -Dbrowser=chrome -Dheadless=true "-Dreport.env=Selenium 4.27 + TestNG 7.10, Chrome headless on GitHub Actions (ubuntu-latest) - https://www.saucedemo.com"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            reports/
            target/surefire-reports/
      # The reports are generated by the test run above and committed untouched.
      # Only runs for a push whose commit message contains [publish-reports].
      - name: Publish the generated reports to the repository
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-reports]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "Add reports generated by GitHub Actions run ${{ github.run_number }}" || exit 0
          git pull --rebase origin main
          git push origin main
